  # Control arm for the adversarial-review experiment: the shipped pack with
  # nxd-review-closure REMOVED. Its Step 6b dispatch is conditional on that
  # skill being installed, so this arm runs the pre-review workflow while every
  # other skill stays byte-identical to current_pack.
  #
  # Hypothesis under test: a second reader holding the original request catches
  # semantic omissions the structural self-check cannot see. Signal to watch is
  # a scenario demanding a derived model starting to pass. ANTI-signal is the
  # reviewed arm scoring WORSE — that would mean the builder is accepting
  # fabricated critique instead of adjudicating it, which is the failure mode
  # the citation-backed rejection contract exists to prevent.
  #
  # Compare: --skill-set no_review_control vs --skill-set current_pack, N>=3 per
  # cell (agent variance across identical prompts is large enough that a single
  # run cannot decide pass/fail).
  no_review_control:
    description: "Shipped pack minus nxd-review-closure — control for the review experiment."
    skills:
      - "src/nxd-setup-cli"
      - "src/nxd-build-data-product"
      - "src/nxd-query-data-product"
      - "src/nxd-analyze-mesh"
      - "src/nxd-toggle-policies"
      - "src/nxd-add-inputs"
      - "src/nxd-add-outputs"
      - "src/nxd-add-expectations-and-promises"
      - "src/nxd-add-policies"
      - "src/nxd-fix-policy-failures"
      - "src/nxd-debug-data-product"
      - "src/nxd-build-semantic-data-product"
      - "src/nxd-run-evals"
      - "src/nxd-run-job-loop"
      - "src/nxd-generate-data-product"
      - "src/nxd-render-static-artifact"
      - "src/nxd-semantic-query-intent"

