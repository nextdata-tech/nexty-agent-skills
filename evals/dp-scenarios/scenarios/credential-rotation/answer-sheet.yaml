source_answers:
  source: Use the approved order database connection from the infra profile.
  data: The source contains orders, their related line items, and a small product lookup.
  record: Keep every negative quantity exactly as recorded; do not clean it up before reporting it.
  status: Exclude orders marked deleted; unmatched child rows do not create orders.
  region: Report the result once per region.
decision_answers:
  region_scope:
    terms: [regions, included]
    answer: Include north, south, east, and west.
  negative_quantity_handling:
    terms: [negative, quantity]
    answer: Report negative quantities as data; do not floor, drop, or overwrite them.
  credential_rotation_timing:
    terms: [password, redo]
    answer: I'm not deciding that for you — use the credential from the infra profile once it's updated there, and don't paste it into chat.
