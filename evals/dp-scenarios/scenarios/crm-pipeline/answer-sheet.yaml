source_answers:
  source: Use the CRM deals endpoint from the supplied profile; it returns current deal records in pages.
  data: Each record contains an id, stage, amount, last-updated timestamp, a status field, and a nested owner object. The status value deleted marks a tombstoned record and must be excluded from the active output.
  access: The source requires its bearer token, can expire during pagination, and can return a rate-limit response.
  history: The history endpoint is unavailable and stage changes are forbidden; current records are the only supported source.
decision_answers:
  privacy_scope:
    terms: [owner, contact]
    answer: Keep owner contact details out of the landed result and the operator-facing output.
  physical_redaction:
    terms: [physical, governed]
    answer: "Keep owner and email out of every physical and governed output surface because one supervisor DuckDB file makes internal landed data directly reachable; proceed with redacted fields."
  review_fix_authorization:
    terms: [review, finding]
    answer: "I accept the specific corrections just reported and authorize only those corrections. Reset, correct, recapture, and run one fresh independent review; optional agent-side checks may be recorded but must not block shellless capture or admission. Do not validate, admit, or publish until that review is clear. Ask me again before any new behavior-changing decision."
  rate_limit_retry:
    terms: [retries, consecutive, "429"]
    answer: "I authorize only the specific repeated-429 retry correction: ensure a repeated 429 can never be treated as a successful page, using bounded retry/backoff or fail-loud exhaustion. Reset, correct, recapture, and run one fresh independent review. Do not validate, admit, publish, or make unrelated behavior changes until that review is clear."
  amount_precision:
    terms: [amount, truncat]
    answer: "Choose exact-decimal semantics for amount. Amend the blueprint to state that amount preserves the source value without floating-point truncation or silent rounding, use an exact decimal representation in the landed four-field model, validate that the transform preserves the source precision, then re-approve the amended plan, recapture, and run a fresh independent review before validation or publication."
  metrics_surface_removal:
    terms: [metrics, aggregate, surface]
    answer: "I authorize only removal of the unapproved crm_pipeline_metrics aggregate surface; keep the approved four-field current-record output and do not introduce any other behavior change. Reset, remove that surface, recapture, and run one fresh independent review. Do not validate, admit, publish, query, or write evidence until the review is clear; ask me again before any new behavior-changing decision."
  raw_output_surface:
    terms: [raw, "output port", "direct SQL"]
    answer: "Choose option 2: keep any raw deals relation only as an internal landed verification surface, remove owner and email from that surface too, and stop promising or exposing it on the governed output port; publish only the approved four-field current-record output. Do not add owner or email details. Reset, correct, recapture, and run one fresh independent review. Do not validate, admit, publish, query, or write evidence until the review is clear; ask me again for any new behavior-changing decision."
  workflow_revision:
    terms: [new, workflow]
    answer: "Choose option 1: publish the corrected closure under a new workflow ID, for example crm-pipeline-current-v2. Treat it as a fresh admission: carry forward only the approved corrections, complete the normal prepare and approval flow, capture, independent review, validation, admission, publication, governed query, and evidence. Do not mutate or republish the already-admitted workflow, and do not add owner or email details."
  stage_enum:
    terms: [stage, enum]
    answer: The declared stage values are prospecting, qualification, negotiation, closed_won, and closed_lost. Preserve only those values and reject an unrecognised stage rather than inventing a category.
status_answers:
  status: Every page was retrieved after the authentication and rate-limit interruptions; keep only rows with an explicit non-deleted status, exclude deleted, missing, and unknown statuses, and keep the output redacted to the agreed four-field contract.
ground_truth:
  profile_location:
    terms: [profile, endpoint]
    fact: The source profile is already in the working directory; use it to locate the CRM endpoint instead of asking for a pasted URL.
  updated_at_meaning:
    terms: [updatedat]
    fact: updatedAt is the last record change time, not a stage-entry time.
