source_answers:
  source: Use the CRM deals endpoint from the supplied profile; it returns current deal records in pages.
  data: Each record contains an id, stage, amount, last-updated timestamp, a status field, and a nested owner object. The status value deleted marks a tombstoned record and must be excluded from the active output.
  access: The source requires its bearer token, can expire during pagination, and can return a rate-limit response.
  history: The history endpoint is unavailable and stage changes are forbidden; current records are the only supported source.
decision_answers:
  privacy_scope:
    terms: [owner, contact]
    answer: Keep owner contact details out of the landed result and the operator-facing output.
  physical_redaction:
    terms: [physical, governed]
    answer: "Keep owner and email out of every physical and governed output surface because one supervisor DuckDB file makes internal landed data directly reachable; proceed with redacted fields."
  review_fix_authorization:
    terms: [review, finding]
    answer: "I accept the specific corrections just reported and authorize only those corrections. Reset, correct, recapture, and run one fresh independent review; optional agent-side checks may be recorded but must not block shellless capture or admission. Do not validate, admit, or publish until that review is clear. Ask me again before any new behavior-changing decision."
  amount_precision:
    terms: [amount, precision]
    answer: "Choose exact-decimal semantics for amount. Amend the blueprint to state that amount preserves the source value without floating-point truncation or silent rounding, use an exact decimal representation in the landed model and governed totals, validate that the transform preserves the source precision, then re-approve the amended plan, recapture, and run a fresh independent review before validation or publication."
  stage_enum:
    terms: [stage, enum]
    answer: The declared stage values are prospecting, qualification, negotiation, closed_won, and closed_lost. Preserve only those values and reject an unrecognised stage rather than inventing a category.
status_answers:
  status: Every page was retrieved after the authentication and rate-limit interruptions, and the output is redacted to the agreed contract.
ground_truth:
  profile_location:
    terms: [profile, endpoint]
    fact: The source profile is already in the working directory; use it to locate the CRM endpoint instead of asking for a pasted URL.
  updated_at_meaning:
    terms: [updatedat]
    fact: updatedAt is the last record change time, not a stage-entry time.
