ground_truth:
  order_amount_column:
    terms: [order_amount]
    fact: order_amount is the total dollar amount for that order; it is fixed per order, not per line item.
  order_amount_column_spaced:
    terms: [order amount]
    fact: order_amount is the total dollar amount for that order; it is fixed per order, not per line item.
  product_column:
    terms: [product, column]
    fact: product on each line item is a descriptive label only; it plays no part in the required regional revenue figure.
