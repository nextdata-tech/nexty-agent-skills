source_answers:
  source: Use the approved order source for the answer.
  data: The source contains orders and their related line items.
  record: Count each active order once, even when it has several related items.
  status: Exclude orders marked deleted; unmatched child rows do not create orders.
  region: Report one exact-cent revenue value for each region.
decision_answers:
  region_scope:
    terms: [regions, included]
    answer: Include north, south, east, and west.
  order_definition:
    terms: [order, count]
    answer: The order is the unit that contributes its amount once.
