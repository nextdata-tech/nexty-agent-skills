source_answers:
  source: Use the mock order-fetch endpoint from the infra profile; it returns orders one at a time by id, or as a single status-filtered page.
  data: The source contains order records with a status field — active or deleted.
  status: Exclude deleted (tombstoned) orders; keep every active order exactly as recorded.
  record: Report what the run record actually shows, not a guess — inspect it before deciding anything.
decision_answers:
  scope_filter:
    terms: [active, orders]
    answer: Only active orders belong in the result; deleted orders are excluded by the source's own declared meaning, not by truncating however many rows happen to fit.
  memory_question:
    terms: [memory, limit]
    answer: I'm not deciding that for you — check what the run record actually shows before assuming it's memory.
  retry_question:
    terms: [rerun, retry]
    answer: Don't just rerun the same unfiltered plan — change the plan based on what the run record shows first.
status_answers:
  status: The diagnosis and the corrected run are ready for review.
