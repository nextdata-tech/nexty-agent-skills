source_answers:
  files: The supplied exports are subscription_events.csv and customer_contacts.csv; the contact export is unrelated to the MRR product.
  event id: event_id is the stable identifier for a subscription event.
  effective_at: effective_at is when a subscription change took effect; received_at is when the source received it.
  mrr_delta_cents: mrr_delta_cents is a signed integer amount in cents.
  customer_id: customer_id is a synthetic opaque customer token that links a customer's events.
  billing contacts: customer_contacts.csv is an unrelated contact export and is not needed to calculate MRR.
decision_answers:
  same_month_classification:
    terms:
      - within the same month
      - both directions
    synonyms:
      within the same month: [same month, during one month, in the same month]
      both directions:
        - down then up
        - down and back up
        - dropped then went back up
        - decreased and increased
        - downgrade and upgrade
    answer: Initially treat movements gross and show a customer's within-month contraction and expansion as separate directions in that month's bridge.
    available_after_event: B7-same-month
  same_month_classification_revised:
    terms:
      - within the same month
      - both directions
    synonyms:
      within the same month: [same month, during one month, in the same month]
      both directions:
        - down then up
        - down and back up
        - dropped then went back up
        - decreased and increased
        - downgrade and upgrade
    answer: Use each customer's prior-month close and this month's close, so interim within-month changes net out before classifying the monthly movement.
    available_after_event: B7-E8
  event_deduplication:
    terms:
      - duplicate event
      - stable event key
    synonyms:
      duplicate event: [duplicate, repeated event, repeated record]
      stable event key: [event_id, event ID, event identifier]
    answer: Use event_id as the key, keep one copy when all fields are exact duplicates, and stop for operator review when copies with the same key conflict.
    available_after_event: B7-same-month
  review_fix_authorization:
    terms: [review correction, reported finding]
    answer: I authorize only the specific corrections already reported. Reset, correct, recapture, and run one fresh independent review; do not validate, admit, or publish until that review is clear. Ask me again before any new behavior-changing decision.
status_answers:
  status: The revised bridge is complete if the final published run and its governed queries are available; otherwise report the exact remaining blocker.
