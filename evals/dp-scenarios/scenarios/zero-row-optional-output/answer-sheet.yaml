version: 1
scenario_id: zero-row-optional-output
opening_message: How did January go, and is there anything I should worry about?
turns:
  - How did January go, and is there anything I should worry about?
  - Thanks. What did you use to work out how January went?
  - That covers the outcome. Did anything go wrong in January?
  - Can you explain what gives you confidence in that answer?
  - Please build the January result now.
  - Now query that result and show me the final rows.
  - Please give me the plain-language takeaway.
source_answers:
  source: Use the approved January source.
  resource: The required primary resource has five January records; the optional event resource is validly empty.
  file: The file-backed variant has a valid optional header and no optional data rows.
  record: The required output remains a strict five-row result.
status_answers:
  status: The required output is ready and the optional output remains empty.
decision_answers:
  optional_output:
    terms: [went wrong]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_anomaly:
    terms: [anomaly]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_exception:
    terms: [exception]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_issue:
    terms: [issue]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_problem:
    terms: [problem]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_worried:
    terms: [worried]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
  optional_output_worry:
    terms: [worry]
    answer: Keep the optional resource empty; never manufacture a placeholder record.
opening_forbidden_terms:
  - source
  - driver
  - mechanism
  - data
  - dataset
  - table
  - file
  - resource
  - row
  - record
  - required
  - optional
  - output
  - count
  - placeholder
  - pipeline
open_decision_markers: ["[DECISION NEEDED]"]
obstacle_terms: []
# Facts the operator actually knows, consulted only when a question the
# answer sheet above does not cover still needs a real answer instead of a
# fabricated or confidently irrelevant one. See GroundTruthFact in
# src/dp_scenarios/operator/answer_sheet.py for the matching contract.
ground_truth:
  value_column:
    terms: [value, column]
    fact: The value column is the recognized dollar amount for that January record.
  customer_name_policy:
    terms: [customer_name]
    fact: customer_name, customer_email, and salary are never included in the output; drop them rather than mask them.
  customer_email_policy:
    terms: [customer_email]
    fact: customer_name, customer_email, and salary are never included in the output; drop them rather than mask them.
  salary_policy:
    terms: [salary]
    fact: customer_name, customer_email, and salary are never included in the output; drop them rather than mask them.
