apiVersion: infra.nextdata.com/v1
kind: Profile
metadata:
  name: desktop-local
spec:
  services:
    - name: duckdb
      driver: nxd:local/duckdb/storage:0.1.0
      attributes: []
    - name: python-compute
      driver: nxd:local/python/compute:0.1.0
      attributes: []
    - name: api-source
      driver: nxd:generic-secrets:1.0.0
      attributes:
        - key: base_url
          value: "http://127.0.0.1:62519"
          public: true
        - key: auth_header
          value: "Authorization"
          public: true
        - key: auth_scheme
          value: "Bearer"
          public: true
        - key: credential_env
          value: "NXD_EVAL_SOURCE_TOKEN"
          public: true
        - key: auth_refresh_path
          value: "/auth/refresh"
          public: true
        - key: endpoint_deals
          value: "/deals"
          public: true
        - key: endpoint_deals_fields
          value: '["id", "name", "stage", "amount", "status", "updatedAt", "owner"]'
          public: true
        - key: endpoint_deals_nested_fields
          value: '{"owner": ["name", "email"]}'
          public: true
        - key: endpoint_deals_pagination
          value: '{"page_size": 2, "cursor_param": "cursor", "items_field": "data", "cursor_field": "next_cursor"}'
          public: true
        - key: endpoint_deals_data_selector
          value: "data"
          public: true
        - key: endpoint_deals_rate_limit_every
          value: "3"
          public: true
