[project]
name = "dp-scenarios"
version = "0.1.0"
description = "Multi-turn data-product scenario suite for the NXD lean-desktop build path — harness, fixtures, evidence ledger, local Claude Code runner, and mechanical grading."
requires-python = ">=3.11"
dependencies = [
    "nxd-eval",              # EX scorer, Wilson/McNemar statistics, report emitters
    "pyyaml>=6.0",           # scenario / route-table / persona definitions
    "duckdb>=1.0",           # gold-row-set reconciliation against landed data
    "aiohttp>=3.9",          # the mock HTTP source server and its client-side tests
    "psycopg[binary]>=3.2",  # live Postgres readiness, seeding, and probes
]

[project.optional-dependencies]
# Provider SDKs are the responsibility of nxd_eval's own extras. The grading
# path is still model-free, but the harness is no longer model-free as a whole:
# with --driver-model the operator side calls OpenAI over aiohttp from
# openai_driver.py. The local live runner invokes the host's Claude Code
# executable separately. The NXD mapper is
# resolved at run time from an explicitly declared artifact manifest or source
# checkout rather than declared here: pinning it as a path dependency would
# hardwire one machine's checkout layout into the lock file and break
# artifact-based environments.

[dependency-groups]
dev = [
    "mutmut>=3.7,<4",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_scenarios"]

[tool.uv]
package = true

[tool.uv.sources]
nxd-eval = { path = "../nxd_eval", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 300
markers = [
    "integration: requires a local Docker runtime and the configured Postgres image",
    "field_mapper: requires a declared NXD field_mapper artifact or source checkout",
]

[tool.mutmut]
# Automated mutation testing — see "Mutation testing" in README.md, and
# scripts/mutation_test.sh for the wrapper that drives it.  mutmut copies the
# tree into ./mutants and runs the suite from there, so `source_paths` is the
# whole package (imports must resolve) while `only_mutate` narrows the actual
# mutation to the two directories where a gate that never fires is the
# recurring defect: the operator turn machinery and mechanical grading.
source_paths = ["src"]
only_mutate = [
    "src/dp_scenarios/operator/*",
    "src/dp_scenarios/grading/*",
]
# Read from disk by the suite, so the relocated copy needs them too.
also_copy = ["scenarios", "scripts"]
# Docker- and Postgres-backed tests are skipped in a normal run anyway;
# deselecting them keeps the per-mutant runs from paying their collection cost.
pytest_add_cli_args = ["-m", "not integration and not field_mapper", "-q"]
