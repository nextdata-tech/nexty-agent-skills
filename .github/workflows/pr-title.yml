name: pr-title

# Enforce Conventional Commits on the PR title. With squash-merge configured to
# use the PR title as the commit subject, this keeps main's history conventional.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed Conventional Commit types. Mirrors the types already used in
          # this repo's history (feat, fix, ci, ...).
          types: |
            feat
            fix
            ci
            docs
            chore
            refactor
            test
            perf
            build
            revert
          requireScope: false
          # Subject must not start uppercase or end with a period.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The PR title subject "{subject}" is invalid: it must start with a
            lowercase letter and must not end with a period.
