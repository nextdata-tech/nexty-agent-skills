name: nightly-mutation

# Automated mutation testing for the dp-scenarios harness.
#
# `evals/dp-scenarios/README.md` has always asked a contributor to mutation-test
# a new check by hand: break the guard, rerun, confirm red. That covers the code
# the contributor just wrote and nothing else, and a hand-rolled mutation can
# silently fail to apply -- which has twice produced a confident wrong answer,
# once reporting a healthy guard as unenforced. mutmut applies every mutant
# through a generated trampoline, so a mutant that did not apply cannot be
# reported as a result at all.
#
# Scope is `src/dp_scenarios/operator/` and `src/dp_scenarios/grading/` (see
# `[tool.mutmut]` in evals/dp-scenarios/pyproject.toml): the turn machinery and
# the mechanical grading, where "a gate that exists but never fires" is the
# recurring defect.
#
# THIS IS THE WHOLE-SCOPE TIER. The PR-time tier lives in ci.yml and mutates
# only the guarded files a pull request actually changed. Both compare against
# evals/dp-scenarios/mutation-baseline.json and fail on *new* survivors, so a
# green run means "this change did not add a gate the suite cannot see", not
# "there are no unkilled mutants".

on:
  schedule:
    # 04:10 UTC, before the MCP canary, so a red mutation run and a red canary
    # do not arrive as one indistinguishable batch of morning noise.
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'mutmut mutant-name filters (blank = the whole guarded scope)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: dp-scenarios mutation (full scope)
    runs-on: ubuntu-latest
    # Runtime is dominated by the *surviving* mutants, not the killed ones:
    # mutmut runs a mutant's covering tests fastest-first and stops at the first
    # failure, so a killed mutant costs milliseconds while a survivor pays for
    # every test that touches it -- including the fixture-generating ones. See
    # the runtime table in evals/dp-scenarios/README.md for measured figures.
    #
    # The cap is deliberately far above the expected run. A mutation job killed
    # mid-run reports fewer survivors, and fewer survivors reads as an
    # improvement.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          # `mutation_test.py changed` needs history; the full tier does not,
          # but keeping both jobs on the same checkout avoids a surprise the
          # first time someone runs this one with a scope filter.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Run mutation testing over the guarded directories
        id: mutation
        env:
          # Passed through the environment rather than interpolated into the
          # command line: a workflow_dispatch input is attacker-controllable
          # text and must never become shell.
          MUTATION_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail
          if [ -n "${MUTATION_SCOPE:-}" ]; then
            # shellcheck disable=SC2086  # a filter list is intentionally split
            python3 evals/dp-scenarios/scripts/mutation_test.py filter $MUTATION_SCOPE
          else
            python3 evals/dp-scenarios/scripts/mutation_test.py full
          fi

      - name: Publish the survivor report
        if: always()
        run: |
          set -euo pipefail
          report=evals/dp-scenarios/mutation-report.txt
          if [ -f "$report" ]; then
            {
              echo '### dp-scenarios mutation testing'
              echo ''
              echo '```'
              tail -c 60000 "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            evals/dp-scenarios/mutation-report.txt
          if-no-files-found: warn
