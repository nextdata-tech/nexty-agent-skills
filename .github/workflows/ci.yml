name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The single NXD revision this repository pins. Two jobs consume artifacts
  # published for it — the field-mapper integration and the semantic MCP
  # contract check — and they must name the SAME revision or "the pair we ship"
  # stops being one pair. Kept here rather than repeated per job so a bump is
  # one edit that cannot half-land.
  #
  # BUMPING: the semantic MCP contract check requires the artifact to carry MCP
  # provenance (semantic_tree_sha / rpc_tree_sha / mcp_contract_sha256). Point
  # this at an NXD commit on main whose python-build run has published such an
  # artifact; a revision that predates the provenance fails the job closed
  # rather than being accepted, which is deliberate — see
  # .github/actions/nxd-artifact and evals/mcp/README.md.
  NXD_PINNED_SHA: 5080aae4b8355aa2c78c649bf3a522960725b653

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # nextdata-public-examples is required by the validator

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skills
        run: python3 scripts/validate_skills.py --root .

      # build-skills.sh only prints an "OVER CAP" status column; it does not
      # exit non-zero. Capture its output and fail if any skill is over cap.
      - name: Build skill zips and enforce the 200-entry cap
        run: |
          set -euo pipefail
          out="$(bash ./build-skills.sh)"
          echo "$out"
          if grep -q "OVER CAP" <<<"$out"; then
            echo "::error::one or more skills exceed the 200-entry Claude Desktop cap"
            exit 1
          fi
          python3 scripts/validate_archives.py --root .

      - uses: astral-sh/setup-uv@v5

      # Harness unit tests. These need no model credentials: they stub the
      # agent/judge backends and run the runner-side checkers directly, so a
      # deterministic gate cannot silently regress to judge-only grading.
      - name: Harness unit tests
        run: uv run --no-project --with pytest --with duckdb --with pyyaml python -m pytest evals/tests -q

      # nxd_eval's own unit tests (stats/scoring/transcript/task-wiring). The
      # `dev` group pins pytest with no provider SDK required, so this installs
      # and runs with no model credentials — see evals/nxd_eval/pyproject.toml.
      - name: nxd_eval unit tests
        working-directory: evals/nxd_eval
        run: uv run pytest -q

      # The scenario harness is its own uv project (isolated heavy deps, editable
      # path dependency on nxd_eval). Its tests are deterministic by design and
      # need no model credentials, no supervisor binary and no network: the
      # fixtures are generated from pinned seeds and the agent sessions are
      # replayed from recordings. Dependency-backed integration tests run in the
      # dedicated jobs below; excluding their markers here prevents an unavailable
      # Docker image or NXD checkout from becoming a silent green skip.
      - name: dp-scenarios harness tests
        working-directory: evals/dp-scenarios
        run: uv run --locked pytest -q -m "not integration and not field_mapper"

      # The semantic MCP contract checker. Stdlib-only by design, so its tests
      # run here with no NXD wheels installed — a checker whose own tests needed
      # the artifact could only be exercised inside the job it exists to guard,
      # and a break in it would surface as that job's failure rather than its
      # own. The wheel-backed half runs in the semantic-contract job below.
      - name: semantic MCP contract checker tests
        working-directory: evals/mcp
        run: uv run --locked pytest -q

      # Benchmark evidence is source-controlled like the skills: validate the
      # stdlib recorder directly and fail if an entry or generated index drifts.
      - name: Benchmark evidence index
        run: |
          set -euo pipefail
          python3 -m unittest evals.tests.test_benchmark_record
          python3 evals/benchmark_record.py --check

  dp-scenarios-postgres:
    name: dp-scenarios Postgres integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Pull the pinned Postgres fixture image
        run: docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
      - name: Run Postgres-backed fixture tests
        working-directory: evals/dp-scenarios
        env:
          EVAL_REQUIRE_LIVE_FIXTURE: "1"
        run: uv run --locked pytest -q -m integration

  dp-scenarios-field-mapper:
    name: dp-scenarios field-mapper integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NXD_REPO_TOKEN: ${{ secrets.NXD_DISPATCH_PAT }}
      EVAL_REQUIRE_LIVE_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Check out the pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: nextdata-tech/nxd
          ref: ${{ env.NXD_PINNED_SHA }}
          path: nxd
          token: ${{ env.NXD_REPO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            components/desktop/supervisor/py
            components/nxd_py/data_product/nxd/experimental
          sparse-checkout-cone-mode: true
      - name: Verify pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        id: nxd-source
        working-directory: nxd
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$NXD_PINNED_SHA"
          echo "$source_sha"
          field_mapper_tree_sha="$(git rev-parse HEAD:components/nxd_py/data_product/nxd/experimental/field_mapper)"
          echo "field_mapper_tree_sha=$field_mapper_tree_sha" >> "$GITHUB_OUTPUT"
      # Resolve / download / verify / install now live in a shared composite
      # action so the semantic-contract job and the nightly canary consume NXD
      # artifacts through exactly the same code. The resolver deliberately
      # considers only completed successful main runs; that makes the lookup
      # deterministic and excludes artifacts from failed or in-progress runs.
      # The token check that used to be the trailing step is the action's first
      # step, so an absent secret still fails the job with the same sentence
      # instead of skipping.
      - name: Consume the published NXD artifact
        id: nxd-artifact
        uses: ./.github/actions/nxd-artifact
        with:
          token: ${{ env.NXD_REPO_TOKEN }}
          token_missing_message: 'NXD_DISPATCH_PAT is unavailable; field-mapper integration cannot resolve the NXD artifact.'
          artifact_prefix: nxd-py-linux-x86_64-${{ steps.nxd-source.outputs.field_mapper_tree_sha }}-
          selector_label: field-mapper tree ${{ steps.nxd-source.outputs.field_mapper_tree_sha }} at source ${{ env.NXD_PINNED_SHA }}
          expect_field_mapper_tree_sha: ${{ steps.nxd-source.outputs.field_mapper_tree_sha }}
          expect_source_sha: ${{ env.NXD_PINNED_SHA }}
          install_project_dir: evals/dp-scenarios
      - name: Run field-mapper grant tests
        working-directory: evals/dp-scenarios
        env:
          EVAL_NXD_ARTIFACT_MANIFEST: ${{ steps.nxd-artifact.outputs.manifest_path }}
          EVAL_NXD_REPO_ROOT: ${{ github.workspace }}/nxd
        run: uv run --locked --no-sync pytest -q -m field_mapper

  semantic-contract:
    # Required lane. Checks the PINNED-and-PUBLISHED pairing: the NXD revision
    # this repository pins, and the artifact NXD published for it. Purely a
    # consumer — it reads a finished artifact and never triggers an NXD build.
    #
    # The nightly canary answers a different question (NXD main against Nexty
    # main, i.e. what is coming); this job answers "does the pair we actually
    # ship agree", which is the one that gates a merge.
    name: semantic MCP contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NXD_REPO_TOKEN: ${{ secrets.NXD_DISPATCH_PAT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Check out the pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: nextdata-tech/nxd
          ref: ${{ env.NXD_PINNED_SHA }}
          path: nxd
          token: ${{ env.NXD_REPO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            components/nxd_py/data_product/nxd/experimental/field_mapper
            components/nxd_py/data_product/nxd/experimental/semantic
            components/nxd_py/drivers/nxd/drivers/rpc
          sparse-checkout-cone-mode: true
      - name: Verify pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        id: nxd-source
        working-directory: nxd
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$NXD_PINNED_SHA"
          field_mapper_tree_sha="$(git rev-parse HEAD:components/nxd_py/data_product/nxd/experimental/field_mapper)"
          semantic_tree_sha="$(git rev-parse HEAD:components/nxd_py/data_product/nxd/experimental/semantic)"
          echo "field_mapper_tree_sha=$field_mapper_tree_sha" >> "$GITHUB_OUTPUT"
          echo "semantic_tree_sha=$semantic_tree_sha" >> "$GITHUB_OUTPUT"
          rpc_tree_sha="$(git rev-parse HEAD:components/nxd_py/drivers/nxd/drivers/rpc)"
          echo "rpc_tree_sha=$rpc_tree_sha" >> "$GITHUB_OUTPUT"
      - name: Consume the published NXD artifact
        id: nxd-artifact
        uses: ./.github/actions/nxd-artifact
        with:
          token: ${{ env.NXD_REPO_TOKEN }}
          token_missing_message: 'NXD_DISPATCH_PAT is unavailable; the semantic MCP contract check cannot resolve the NXD artifact.'
          artifact_prefix: nxd-py-linux-x86_64-${{ steps.nxd-source.outputs.field_mapper_tree_sha }}-${{ steps.nxd-source.outputs.semantic_tree_sha }}-${{ env.NXD_PINNED_SHA }}-
          selector_label: semantic tree ${{ steps.nxd-source.outputs.semantic_tree_sha }} at source ${{ env.NXD_PINNED_SHA }}
          expect_field_mapper_tree_sha: ${{ steps.nxd-source.outputs.field_mapper_tree_sha }}
          expect_semantic_tree_sha: ${{ steps.nxd-source.outputs.semantic_tree_sha }}
          expect_rpc_tree_sha: ${{ steps.nxd-source.outputs.rpc_tree_sha }}
          expect_source_sha: ${{ env.NXD_PINNED_SHA }}
          require_mcp_provenance: 'true'
          install_project_dir: evals/mcp
      - name: Extract the eval MCP surface
        working-directory: evals/mcp
        run: uv run --locked --no-sync python contract_surface.py --out "$RUNNER_TEMP/eval-surface.json"
      - name: Check the eval surface against the shipped NXD contract
        working-directory: evals/mcp
        run: uv run --locked --no-sync python contract_check.py --surface "$RUNNER_TEMP/eval-surface.json"
      # Names BOTH sides of the pairing that was checked. Runs on failure too:
      # a red run whose summary does not say which NXD build it was measured
      # against sends the reader to the logs to find out what it even compared.
      - name: Record the checked pairing
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### semantic MCP contract"
            echo "- **nexty sha**: \`$GITHUB_SHA\`"
            echo "- **nxd source**: \`${{ steps.nxd-artifact.outputs.source_sha }}\`"
            echo "- **nxd semantic tree**: \`${{ steps.nxd-artifact.outputs.semantic_tree_sha }}\`"
            echo "- **nxd rpc tree**: \`${{ steps.nxd-artifact.outputs.rpc_tree_sha }}\`"
            echo "- **mcp contract sha256**: \`${{ steps.nxd-artifact.outputs.mcp_contract_sha256 }}\`"
            echo "- **artifact**: \`${{ steps.nxd-artifact.outputs.artifact_name }}\` (run ${{ steps.nxd-artifact.outputs.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  dp-scenarios-mutation:
    # PR-TIME MUTATION TIER. Mutates only the guarded files this change touches
    # -- `evals/dp-scenarios/src/dp_scenarios/operator/` and `.../grading/` --
    # and fails on a surviving mutant that is not in
    # `evals/dp-scenarios/mutation-baseline.json`.
    #
    # A surviving mutant is a change to the guarded code that the whole suite
    # still passes with, which is the precise statement of the defect this
    # harness keeps producing: a gate that exists and never fires, or a test
    # that asserts the code's self-report instead of the property. The whole
    # scope runs nightly (.github/workflows/nightly-mutation.yml); this job only
    # asks that a change carry tests for the lines it adds.
    #
    # It is scoped rather than budget-capped because a cap has to choose which
    # mutants to skip, and any deterministic choice is one an author can learn
    # to write around. Scoping to the diff skips nothing inside what changed.
    name: dp-scenarios mutation (changed files)
    runs-on: ubuntu-latest
    # Every run pays a fixed cost before any mutant is checked: mutmut copies
    # the tree and traces the suite once to map each function to its covering
    # tests. After that, only the changed modules' mutants run. The worst case
    # is a diff to grading/gates.py, whose covering set includes the
    # fixture-generating tier tests -- see the runtime table in
    # evals/dp-scenarios/README.md.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff base has to exist locally for `git merge-base` to resolve.
          fetch-depth: 0

      # Decided before installing anything: most pull requests touch neither
      # directory, and this job should cost them nothing but a few seconds.
      - name: Decide whether any guarded file changed
        id: scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD -- \
            evals/dp-scenarios/src/dp_scenarios/operator \
            evals/dp-scenarios/src/dp_scenarios/grading || true)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "guarded=true" >> "$GITHUB_OUTPUT"
            echo "Guarded files changed:"
            echo "$changed"
          else
            echo "guarded=false" >> "$GITHUB_OUTPUT"
            echo "No guarded file changed; mutation testing has nothing to do."
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.guarded == 'true'
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.guarded == 'true'

      - name: Mutate the guarded files this change touches
        if: steps.scope.outputs.guarded == 'true'
        run: python3 evals/dp-scenarios/scripts/mutation_test.py changed --base "${{ steps.scope.outputs.base }}"

      # Runs on failure too: the survivor diffs are the entire point of a red
      # run here, and a reader who has to open the raw log to find out which
      # property is untested will disable the job instead.
      - name: Publish the survivor report
        if: always() && steps.scope.outputs.guarded == 'true'
        run: |
          set -euo pipefail
          report=evals/dp-scenarios/mutation-report.txt
          if [ -f "$report" ]; then
            {
              echo '### dp-scenarios mutation testing (changed files)'
              echo ''
              echo '```'
              tail -c 60000 "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
