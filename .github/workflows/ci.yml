name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # nextdata-public-examples is required by the validator

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skills
        run: python3 scripts/validate_skills.py --root .

      # build-skills.sh only prints an "OVER CAP" status column; it does not
      # exit non-zero. Capture its output and fail if any skill is over cap.
      # Also assert that each named artifact is a real plugin ZIP rather than
      # a ZIP containing the individual skill ZIPs.
      - name: Build skill zips and enforce the 200-entry cap
        run: |
          set -euo pipefail
          out="$(bash ./build-skills.sh)"
          echo "$out"
          if grep -q "OVER CAP" <<<"$out"; then
            echo "::error::one or more skills exceed the 200-entry Claude Desktop cap"
            exit 1
          fi
          version="$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          for stem in nexty-desktop nexty-datamesh nexty-agent-skills; do
            pack="build/${stem}-v${version}.zip"
            test -f "$pack"
            unzip -p "$pack" .claude-plugin/plugin.json | python3 -c '
            import json, sys
            plugin = json.load(sys.stdin)
            assert "skills" not in plugin
            assert "skills/" in "".join(__import__("subprocess").check_output(["unzip", "-Z1", sys.argv[1]], text=True))
            ' "$pack"
            if unzip -Z1 "$pack" | grep -q '\.zip$'; then
              echo "::error::${stem} plugin ZIP must not contain nested ZIPs"
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@v5

      # Harness unit tests. These need no model credentials: they stub the
      # agent/judge backends and run the runner-side checkers directly, so a
      # deterministic gate cannot silently regress to judge-only grading.
      - name: Harness unit tests
        run: uv run --no-project --with pytest --with duckdb --with pyyaml python -m pytest evals/tests -q

      # nxd_eval's own unit tests (stats/scoring/transcript/task-wiring). The
      # `dev` group pins pytest with no provider SDK required, so this installs
      # and runs with no model credentials — see evals/nxd_eval/pyproject.toml.
      - name: nxd_eval unit tests
        working-directory: evals/nxd_eval
        run: uv run pytest -q

      # The scenario harness is its own uv project (isolated heavy deps, editable
      # path dependency on nxd_eval). Its tests are deterministic by design and
      # need no model credentials, no supervisor binary and no network: the
      # fixtures are generated from pinned seeds and the agent sessions are
      # replayed from recordings. Dependency-backed integration tests run in the
      # dedicated jobs below; excluding their markers here prevents an unavailable
      # Docker image or NXD checkout from becoming a silent green skip.
      - name: dp-scenarios harness tests
        working-directory: evals/dp-scenarios
        run: uv run --locked pytest -q -m "not integration and not field_mapper"

      # Benchmark evidence is source-controlled like the skills: validate the
      # stdlib recorder directly and fail if an entry or generated index drifts.
      - name: Benchmark evidence index
        run: |
          set -euo pipefail
          python3 -m unittest evals.tests.test_benchmark_record
          python3 evals/benchmark_record.py --check

  dp-scenarios-postgres:
    name: dp-scenarios Postgres integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Pull the pinned Postgres fixture image
        run: docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
      - name: Run Postgres-backed fixture tests
        working-directory: evals/dp-scenarios
        env:
          EVAL_REQUIRE_LIVE_FIXTURE: "1"
        run: uv run --locked pytest -q -m integration

  dp-scenarios-field-mapper:
    name: dp-scenarios field-mapper integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NXD_REPO_TOKEN: ${{ secrets.NXD_DISPATCH_PAT }}
      EVAL_REQUIRE_LIVE_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Check out the pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: nextdata-tech/nxd
          ref: bb5fa1e3ab4ca381edc8e309449e77639e9ff8af
          path: nxd
          token: ${{ env.NXD_REPO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            components/desktop/supervisor/py
            components/nxd_py/data_product/nxd/experimental
          sparse-checkout-cone-mode: true
      - name: Verify pinned NXD source
        if: env.NXD_REPO_TOKEN != ''
        id: nxd-source
        working-directory: nxd
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "bb5fa1e3ab4ca381edc8e309449e77639e9ff8af"
          echo "$source_sha"
          field_mapper_tree_sha="$(git rev-parse HEAD:components/nxd_py/data_product/nxd/experimental/field_mapper)"
          echo "field_mapper_tree_sha=$field_mapper_tree_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve NXD Python artifact
        if: env.NXD_REPO_TOKEN != ''
        id: nxd-artifact
        env:
          GH_TOKEN: ${{ env.NXD_REPO_TOKEN }}
          FIELD_MAPPER_TREE_SHA: ${{ steps.nxd-source.outputs.field_mapper_tree_sha }}
        run: |
          set -euo pipefail
          artifact_prefix="nxd-py-linux-x86_64-$FIELD_MAPPER_TREE_SHA-"
          # NXD_DISPATCH_PAT needs contents:read and actions:read on
          # nextdata-tech/nxd for this cross-repository lookup.
          # The producer appends source and run identity after this prefix, so
          # resolve the newest unexpired main artifact without relying on a
          # name that can collide across source commits.
          # Resolve through recent NXD main workflow runs instead of paginating
          # the entire artifact catalog, which contains hundreds of thousands
          # of historical artifacts.
          if ! workflow_runs="$(gh api \
            "repos/nextdata-tech/nxd/actions/workflows/nxd.ci.yml/runs?branch=main&per_page=20")"; then
            echo "NXD_DISPATCH_PAT cannot read Actions artifacts from nextdata-tech/nxd; grant contents:read and actions:read" >&2
            exit 1
          fi
          artifact=''
          while IFS= read -r run_id; do
            if ! run_artifacts="$(gh api \
              "repos/nextdata-tech/nxd/actions/runs/$run_id/artifacts?per_page=100")"; then
              echo "NXD_DISPATCH_PAT cannot read Actions artifacts from nextdata-tech/nxd; grant contents:read and actions:read" >&2
              exit 1
            fi
            artifact="$(jq -c --arg artifact_prefix "$artifact_prefix" '
              [.artifacts[]
                | select(.expired == false)
                | select(.name | startswith($artifact_prefix))]
              | sort_by(.created_at)
              | .[-1] // empty
            ' <<< "$run_artifacts")"
            if [ -n "$artifact" ]; then
              break
            fi
          done < <(jq -r '.workflow_runs[] | select(.head_branch == "main") | .id' <<< "$workflow_runs")
          if [ -z "$artifact" ]; then
            echo "No unexpired main-branch NXD artifact found for $FIELD_MAPPER_TREE_SHA" >&2
            exit 1
          fi
          run_id="$(jq -r '.workflow_run.id // empty' <<< "$artifact")"
          resolved_name="$(jq -r '.name // empty' <<< "$artifact")"
          if [ -z "$run_id" ] || [[ "$resolved_name" != "$artifact_prefix"* ]]; then
            echo "The resolved NXD artifact has no valid workflow run or name" >&2
            exit 1
          fi
          echo "artifact_name=$resolved_name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Resolved $resolved_name from NXD workflow run $run_id"
      - name: Download NXD Python artifact
        if: env.NXD_REPO_TOKEN != ''
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ env.NXD_REPO_TOKEN }}
          repository: nextdata-tech/nxd
          run-id: ${{ steps.nxd-artifact.outputs.run_id }}
          name: ${{ steps.nxd-artifact.outputs.artifact_name }}
          path: nxd-artifact
      - name: Verify NXD Python artifact
        if: env.NXD_REPO_TOKEN != ''
        id: artifact-manifest
        env:
          FIELD_MAPPER_TREE_SHA: ${{ steps.nxd-source.outputs.field_mapper_tree_sha }}
          ARTIFACT_RUN_ID: ${{ steps.nxd-artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          manifest="nxd-artifact/manifest.json"
          test -f "$manifest"
          jq -e \
            --arg field_mapper_tree_sha "$FIELD_MAPPER_TREE_SHA" \
            --arg artifact_run_id "$ARTIFACT_RUN_ID" \
            '(.schema == "nxd-py-artifact-v1")
             and (.repository == "nextdata-tech/nxd")
             and (.source_sha // "" | test("^[0-9a-f]{40}$"))
             and (.workflow_run_id == $artifact_run_id)
             and (.field_mapper_tree_sha == $field_mapper_tree_sha)
             and (.platform == "linux-x86_64")
             and (.python == "3.11")
             and (.package_version != null)
             and (.packages["nxd-core"] != null)
             and (.packages["nxd-data_product"] != null)
             and (.packages["nxd-drivers"] != null)
             and (.wheels | length > 0)' "$manifest" >/dev/null

          while IFS=$'\t' read -r name expected_sha256; do
            wheel="nxd-artifact/wheels/$name"
            test -f "$wheel"
            actual_sha256="$(sha256sum "$wheel" | awk '{print $1}')"
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "SHA-256 mismatch for $name" >&2
              exit 1
            fi
          done < <(jq -r '.wheels[] | [.name, .sha256] | @tsv' "$manifest")

          package_version="$(jq -r '.package_version' "$manifest")"
          jq -e --arg package_version "$package_version" \
            '(.packages | to_entries | all(.value == $package_version))' "$manifest" >/dev/null
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          cat "$manifest"
      - name: Install NXD Python artifact
        if: env.NXD_REPO_TOKEN != ''
        working-directory: evals/dp-scenarios
        env:
          PACKAGE_VERSION: ${{ steps.artifact-manifest.outputs.package_version }}
        run: |
          set -euo pipefail
          uv sync --locked
          uv pip install \
            --python .venv/bin/python \
            --no-index \
            --find-links "${{ github.workspace }}/nxd-artifact/wheels" \
            "nxd-core==$PACKAGE_VERSION" \
            "nxd-data_product==$PACKAGE_VERSION" \
            "nxd-drivers==$PACKAGE_VERSION"
      - name: Run field-mapper grant tests
        if: env.NXD_REPO_TOKEN != ''
        working-directory: evals/dp-scenarios
        env:
          EVAL_NXD_ARTIFACT_MANIFEST: ${{ github.workspace }}/nxd-artifact/manifest.json
          EVAL_NXD_REPO_ROOT: ${{ github.workspace }}/nxd
        run: uv run --locked --no-sync pytest -q -m field_mapper
      - name: Require NXD artifact token
        if: env.NXD_REPO_TOKEN == ''
        run: |
          echo "NXD_DISPATCH_PAT is unavailable; field-mapper integration cannot resolve the NXD artifact." >&2
          exit 1
