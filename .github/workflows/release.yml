name: release

# Package every skill in src/ into a Claude Desktop-installable zip and publish
# them as a GitHub Release. Claude Desktop installs individual skills through the
# Skills UI, while the whole pack is uploaded through Customize > Plugins, so the
# release assets are one zip per skill plus one uploadable whole-pack plugin zip.
#
# A release is also the point where the eval suite runs for real. PR evals are
# opt-in (the `run-evals` label, see evals.yml), so a released commit may never
# have been measured on a PR — and a PR head SHA is not the commit that lands on
# main anyway. The `release-evals` job below therefore runs the suite against the
# tagged commit itself and publishes the report as the `evals.json` release
# asset. That asset is the evidence the nxd submodule bump requires before its
# PR can merge (see nxd .github/workflows/nxd.bump-nexty-skills.yml), so a
# release with failing or missing evals cannot reach the monorepo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.1). Must already exist or will be created from the current ref.'
        required: true
        type: string
      skip_evals:
        description: 'Publish without running the eval gate. Emergency use only — the release ships with no evals.json, and the nxd bump PR will open blocked.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Release eval gate. Runs the full public suite on the tagged commit and
  # fails the release if any cell regresses against evals/baselines/public.json.
  #
  # Full suite, not affected-scenarios: at release time there is no meaningful
  # "changed skill" to narrow by (the diff since the previous tag can span the
  # whole pack), and this is the one run whose result is published as the
  # release's evidence. Retry-on-regression mirrors the PR gate — a single agent
  # run is too noisy to block a release on.
  # ---------------------------------------------------------------------------
  release-evals:
    # Written as an explicit event check rather than `!inputs.skip_evals`. On a
    # tag push there is no `inputs` context, so that form works only because the
    # input is declared `type: boolean` and null is falsy. Redeclaring it as a
    # string would make `!"false"` evaluate to false, silently skipping the gate
    # on every release. Naming the event removes that footgun.
    if: ${{ github.event_name == 'push' || inputs.skip_evals != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # example data products the scenarios reference
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deterministic scenario checkers shell out to `uv`; without it they abort
      # with an infrastructure ERROR before the regression gate can run.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install and authenticate Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @openai/codex
          # `codex` does NOT pick up OPENAI_API_KEY from the environment: it
          # defaults to ChatGPT-style websocket auth and 401s without a stored
          # credential. The key has to be handed to an explicit login.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is empty — the codex backend cannot authenticate." >&2
            exit 1
          fi
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status
          # `codex` installs bundled system skills on first run and fails with
          # "Directory not empty (os error 39)" when the target already exists
          # from the npm install. Clearing it lets the first run populate it.
          rm -rf "${CODEX_HOME:-$HOME/.codex}/skills" || true

      - name: Run the public suite on the tagged commit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Codex's workspace-write sandbox is bubblewrap-based and cannot create
          # a network namespace on a GitHub-hosted runner. The runner is itself
          # the disposable isolation boundary. Never set this on a shared machine.
          EVAL_CODEX_AGENT_SANDBOX: danger-full-access
        run: |
          set -euo pipefail
          # Select the CI-runnable scenarios rather than passing a bare
          # `--suite public`. `run.py` does not read `ci_skip` — only
          # affected_scenarios.py does — so a bare suite run would include the
          # scenarios that need a live desktop supervisor, a semantic MCP server,
          # or multi-turn (which the codex backend cannot drive). Those cells
          # ERROR, and because they are absent from evals/baselines/public.json
          # compare_baseline.py reports them as ungated `NEW`. The gate would go
          # green having measured nothing about them — a fail-open gate in the
          # one place this workflow exists to guarantee something.
          #
          # Asking affected_scenarios.py with a harness path reuses its existing
          # "everything except ci_skip" branch, so ci_skip stays defined in one
          # place instead of being duplicated here and drifting.
          echo '.github/workflows/evals.yml' > release-changed.txt
          python3 evals/affected_scenarios.py --changed-file release-changed.txt > selection.json
          python3 -c '
          import json
          print("\n".join(json.load(open("selection.json"))["scenarios"]))
          ' > runnable.txt
          echo "Scenarios selected for the release gate:"; sed 's/^/  - /' runnable.txt
          if [ ! -s runnable.txt ]; then
            echo "::error::no runnable scenarios selected — the release gate would pass vacuously"
            exit 1
          fi

          args=(--suite public --report evals.json
                --agent-backend codex --judge-backend codex
                --skill-set current_pack
                --concurrency 4)
          while IFS= read -r scenario; do
            [ -n "$scenario" ] && args+=(--scenario "$scenario")
          done < runnable.txt
          python3 evals/run.py "${args[@]}"

      # Release-only strictness, deliberately not pushed into compare_baseline.py.
      # That script treats an ERROR cell as carrying no signal and an unbaselined
      # cell as ungated, which is right for a PR: an infrastructure blip should
      # not red someone's unrelated change. It is wrong here. This run is the
      # published evidence, so a cell that never produced a verdict means the
      # evidence is incomplete, and shipping it as proof would be a lie of
      # omission. Only ~10 of the cells are baselined, so without this check a
      # release could go green on a report that is mostly ERROR.
      - name: Require every selected cell to have produced a verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          # Same shape compare_baseline.load_report expects: {"results": [...]}.
          data = json.load(open("evals.json"))
          results = data.get("results")
          if not isinstance(results, list):
              sys.exit("evals.json: report has no `results` list")
          bad = []
          for r in results:
              key = f"{r.get('skill_set')}/{r.get('scenario')}"
              metrics = r.get("metrics") or {}
              if not r.get("ok", False) or r.get("error"):
                  bad.append((key, r.get("error") or "did not complete"))
              elif metrics.get("sandbox_blocked"):
                  bad.append((key, "sandbox blocked every shell call"))
          print(f"{len(results)} cell(s) in the release report; {len(bad)} without a verdict")
          for key, why in bad:
              print(f"  ERROR  {key}: {why}")
          if bad:
              print("::error::the release eval report contains cells that never produced "
                    "a verdict — it cannot serve as evidence that this version was measured")
              sys.exit(1)
          PY

      - name: Gate on regression vs baseline
        id: gate
        run: |
          set -euo pipefail
          # First pass reports and captures regressed cells; it does not fail.
          # The same cell has been observed PASS, FAIL, then PASS again on
          # identical input, so one failure is not yet evidence of a regression.
          status=0
          python3 evals/compare_baseline.py --report evals.json --suite public \
            --write-regressed regressed.txt | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          if [ -s regressed.txt ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Regressed cells to retry:"; cat regressed.txt
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit $status
          fi

      - name: Retry regressed scenarios
        if: steps.gate.outputs.retry == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_CODEX_AGENT_SANDBOX: danger-full-access
        run: |
          set -euo pipefail
          args=(--suite public --report evals-retry.json
                --agent-backend codex --judge-backend codex
                --skill-set current_pack
                --concurrency 4)
          while IFS= read -r scenario; do
            [ -n "$scenario" ] && args+=(--scenario "$scenario")
          done < regressed.txt
          python3 evals/run.py "${args[@]}"

      - name: Confirm regressions against the retry
        if: steps.gate.outputs.retry == 'true'
        run: |
          set -euo pipefail
          # A cell blocks the release only if it regressed twice. One that passes
          # on retry is reported as FLAKY-RUN and does not block.
          python3 evals/compare_baseline.py --report evals.json --suite public \
            --confirm-with evals-retry.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Only reached when the gate passed, so this artifact exists if and only if
      # the tagged commit's evals are green. The release job publishes it as the
      # evals.json asset, and nxd's bump treats its presence as the gate.
      # evals.json alone, so `if-no-files-found: error` actually means what it
      # says. Listing evals-retry.json here too would make the check set-wide:
      # on a healthy release there is no retry, and a run that produced only the
      # retry report would still "succeed" and hand a retry-only artifact on.
      - name: Upload the eval report for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-evals
          path: evals.json
          if-no-files-found: error

      - name: Upload the retry report
        if: steps.gate.outputs.retry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-evals-retry
          path: evals-retry.json
          if-no-files-found: warn

  release:
    needs: release-evals
    # `needs` on a skipped job makes the dependent skip too, so a skip_evals
    # dispatch must explicitly allow the skipped result through. `failure()` and
    # `cancelled()` are still excluded: only success-or-deliberately-skipped runs.
    #
    # The skip branch requires the dispatch event as well as the input, so a
    # release-evals job skipped for any *other* reason (a paths filter added
    # later, the job disabled) can never be mistaken for a deliberate opt-out on
    # a tag push. See the release-evals `if` for why `inputs` is not trusted bare.
    if: >-
      ${{ always() && (
        needs.release-evals.result == 'success'
        || (github.event_name == 'workflow_dispatch'
            && inputs.skip_evals == true
            && needs.release-evals.result == 'skipped')
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # nextdata-public-examples is bundled into some skills
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${tag}"

      # The plugin version is the single source of truth. A vX.Y.Z tag must match
      # .claude-plugin/plugin.json so the published pack and the manifest never drift.
      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          ver="$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [[ "$tag" != "v${ver}" ]]; then
            echo "::error::tag '$tag' does not match plugin.json version 'v${ver}'. Bump the manifest or fix the tag."
            exit 1
          fi
          echo "Tag matches plugin version ${ver}"

      - name: Validate skills
        run: python3 scripts/validate_skills.py --root .

      # build-skills.sh writes one zip per skill plus the uploadable whole-pack
      # plugin zip into build/. It only prints an "OVER CAP" status; it never
      # exits non-zero, so we grep.
      - name: Build skill zips and enforce the 200-entry Claude Desktop cap
        run: |
          set -euo pipefail
          out="$(bash ./build-skills.sh)"
          echo "$out"
          if grep -q "OVER CAP" <<<"$out"; then
            echo "::error::one or more skills exceed the 200-entry Claude Desktop cap"
            exit 1
          fi

      # The green report from release-evals. Downloaded before assembling assets
      # so `evals.json` ships with the release; nxd's submodule bump reads it as
      # the gate. Skipped only on a skip_evals dispatch, where no artifact exists.
      - name: Download the release eval report
        if: ${{ !inputs.skip_evals }}
        uses: actions/download-artifact@v4
        with:
          name: release-evals
          path: eval-report

      # Publish both the individual skill zips and the single whole-pack plugin
      # zip. The latter is the supported Claude Desktop/Cowork upload path.
      - name: Assemble release assets
        id: assets
        env:
          # Empty on the tag-push path, where there is no `inputs` context.
          SKIP_EVALS: ${{ inputs.skip_evals }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Per-skill zips and nexty-agent-skills-v<version>.zip (both built by
          # build-skills.sh). The pack is a real plugin ZIP, not a zip of zips.
          for z in build/*.zip; do
            cp "$z" "dist/$(basename "$z")"
          done
          # Eval evidence, published as its own asset. Its presence is the
          # contract nxd checks; a skip_evals release deliberately has none.
          if [ -f eval-report/evals.json ]; then
            cp eval-report/evals.json dist/evals.json
            echo "evals=true" >> "$GITHUB_OUTPUT"
          elif [ "${SKIP_EVALS:-}" = "true" ]; then
            echo "evals=false" >> "$GITHUB_OUTPUT"
            echo "::warning::publishing without evals.json (skip_evals) — the nxd bump PR will open blocked."
          else
            # release-evals succeeded (the job `if` guarantees it on this path),
            # so the report must exist. Reaching here means the plumbing between
            # the two jobs is broken — artifact name drift, a partial download.
            # Publishing anyway would ship a release stamped "evals NOT RUN"
            # while the suite had in fact passed, and would quietly relocate the
            # whole guarantee into nxd's re-check. Fail instead.
            echo "::error::evals.json is missing though the eval gate passed — the release/eval plumbing is broken."
            exit 1
          fi
          echo "Assets:"
          ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          notes=$(cat <<'EOF'
          Nexty AI Pro skill pack — Claude Desktop installable bundles.

          **Install one skill (Claude Desktop):** download the matching `<skill>.zip`
          below, then upload it under Settings → Capabilities → Skills (or drag it
          into a chat).

          **Install the whole pack:** download `nexty-agent-skills-<tag>.zip`, then
          use Customize → Plugins → Add plugin → Upload plugin.

          **Claude Code users:** prefer the plugin/marketplace flow in the README;
          these zips target Claude Desktop.
          EOF
          )
          # Record the eval verdict in the notes. `evals.json` in the asset list
          # is the machine-readable form nxd gates on; this line is for humans
          # reading the release page.
          if [ "${{ steps.assets.outputs.evals }}" = "true" ]; then
            notes="${notes}"$'\n\n''**Evals:** the public suite ran green on this commit; see the `evals.json` asset.'
          else
            notes="${notes}"$'\n\n''**Evals: NOT RUN.** Published with `skip_evals`. The nxd submodule bump for this version will open blocked until evals are recorded.'
          fi
          # Create the tag-backed release if it doesn't exist yet, then upload assets.
          #
          # Re-running a release over an existing tag is the documented recovery
          # from a `skip_evals` publish: add credits, re-run with the gate on, and
          # the green `evals.json` lands on the release nxd already queries. The
          # notes MUST be rewritten alongside the assets. Uploading `evals.json`
          # while leaving notes that still say "Evals: NOT RUN" leaves the release
          # page contradicting its own asset — and since the notes are what a human
          # reads, the recovery would look like it never happened. `--notes` is
          # therefore applied on both paths, not just on create.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes "$notes" \
              --verify-tag
          fi

      # Notify the nxd monorepo to bump its external/nexty-agent-skills submodule
      # pin, which rebuilds the nxd-cli-installer bundle so `nxd activate skills`
      # serves this release. Requires NXD_DISPATCH_PAT: a fine-grained PAT with
      # contents:write + pull-requests:write on nextdata-tech/nxd only (the
      # default github.token cannot dispatch to another repository).
      - name: Notify nxd to bump the skills submodule
        env:
          GH_TOKEN: ${{ secrets.NXD_DISPATCH_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVALS: ${{ steps.assets.outputs.evals }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "NXD_DISPATCH_PAT not set — skipping nxd notification (release still published)."
            exit 0
          fi
          # `evals` is a hint for the bump PR's body. It is deliberately NOT the
          # gate: a client_payload field is whatever the dispatcher claims, so
          # nxd re-verifies the evals.json asset against this repo's release API
          # rather than trusting this flag.
          gh api repos/nextdata-tech/nxd/dispatches \
            -f event_type=nexty-skills-release \
            -F "client_payload[tag]=${TAG}" \
            -F "client_payload[sha]=${GITHUB_SHA}" \
            -F "client_payload[evals]=${EVALS}"
          echo "Dispatched nexty-skills-release (${TAG}, evals=${EVALS}) to nextdata-tech/nxd"
